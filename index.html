<style>/* NEXUS CAOS — estilos. Paleta: documento (cartas) + revista "EVOLUCIÓN MUSICAL" (menús). */
:root{
  --papel:#efe9d6;--papel2:#e3dbc2;--tinta:#1c1a17;--gris:#5d574c;
  --petroleo:#164a64;--petroleo2:#0e3346;--rojo:#c42222;--mostaza:#c9a23a;--mostaza2:#e8c96a;
  --fuego:#C42222;--agua:#257CA2;--tierra:#308936;--aire:#A7B7BB;--carbon:#3D3939;--negro:#000;
  --plata:#C0C0C0;--oro:#BFAF5B;
  --fd:"Titulos","Arial Narrow",Impact,sans-serif;--fb:"Cuerpo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fm:"Maquina","Courier New",ui-monospace,monospace;--fs:"Revista",Georgia,"Times New Roman",serif;
  --cw:min(27vw,128px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--papel);color:var(--tinta);font:16px/1.4 var(--fb);overscroll-behavior:none}
body{overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
#app{min-height:100dvh}
.quieto *,.quieto *::before,.quieto *::after{animation:none!important;transition:none!important}
.oculto{display:none!important}
/* ---------- tipografía de revista ---------- */
.fd{font-family:var(--fd);font-weight:700;letter-spacing:.01em}
.maq{font-family:var(--fm);text-transform:uppercase;letter-spacing:.12em;font-size:.74rem}
.ital{font:italic 1.05rem/1.3 var(--fs)}
.esp{letter-spacing:.42em}
.rojo{color:var(--rojo)}.pet{color:var(--petroleo)}.mos{color:var(--mostaza)}
/* ---------- páginas ---------- */
.pag{min-height:100dvh;max-width:760px;margin:0 auto;padding:0 0 calc(24px + env(safe-area-inset-bottom));position:relative}
.franja{display:flex;justify-content:space-between;align-items:stretch;background:var(--petroleo);color:var(--papel);padding-top:env(safe-area-inset-top)}
.franja span{font-family:var(--fm);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;padding:9px 14px}
.franja .der{background:var(--papel2);color:var(--petroleo)}
.cuerpo{padding:14px 16px}
.portada h1{font-family:var(--fd);font-size:clamp(3.4rem,19vw,7.2rem);line-height:.8;margin:6px 0 0;color:var(--petroleo);letter-spacing:-.01em}
.portada h1 b{display:block;color:var(--rojo)}
.portada .logo{width:min(46vw,210px);height:auto;display:block;margin:-8px 0 0 auto;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.18))}
.cabeza{display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
.lema{font-family:var(--fd);color:var(--petroleo);font-size:1.5rem;line-height:.95;margin:10px 0 4px}
.pagnum{position:absolute;right:14px;bottom:calc(8px + env(safe-area-inset-bottom));font-family:var(--fm);font-size:.7rem;letter-spacing:.2em;color:var(--gris)}
h2.tit{font-family:var(--fd);font-size:2.4rem;line-height:.9;margin:8px 0;color:var(--petroleo)}
h3.tit{font:italic 700 1.45rem/1.1 var(--fs);margin:18px 0 6px;color:var(--rojo)}
h3.tit::before{content:"✦ ";font-style:normal;color:var(--mostaza)}
.regla{border-top:3px solid var(--tinta);margin:12px 0}
.pelicula{background:#000;color:var(--mostaza2);padding:18px 14px;position:relative;font-family:var(--fm);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.45}
.pelicula::before,.pelicula::after{content:"";position:absolute;left:6px;right:6px;height:7px;background:repeating-linear-gradient(90deg,var(--papel) 0 9px,transparent 9px 19px);opacity:.9}
.pelicula::before{top:4px}.pelicula::after{bottom:4px}
.chispa::after{content:" ✦";color:var(--mostaza)}
/* ---------- botones ---------- */
.btn{white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:10px 16px;margin:9px 0;border:2.5px solid var(--tinta);background:var(--papel);color:var(--tinta);font-family:var(--fd);font-size:1.35rem;letter-spacing:.03em;text-align:left;box-shadow:5px 5px 0 var(--tinta);transition:transform .08s,box-shadow .08s}
.btn small{font:700 .66rem/1.25 var(--fm);letter-spacing:.12em;text-transform:uppercase;opacity:.85;white-space:normal;text-align:right}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--tinta)}
.btn.rj{background:var(--rojo);color:#fff}.btn.pt{background:var(--petroleo);color:var(--papel)}.btn.ms{background:var(--mostaza)}.btn.ng{background:#000;color:var(--papel)}
.btn:disabled{opacity:.45;box-shadow:none}
.fila-btn{display:flex;gap:10px}.fila-btn .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;margin:4px 6px 4px 0;border:2px solid var(--tinta);background:var(--papel);font:700 .8rem var(--fm);letter-spacing:.08em;text-transform:uppercase}
.chip.on{background:var(--tinta);color:var(--papel)}
.chip .sim{width:20px;height:20px}
.campo{display:block;margin:10px 0 4px;font:700 .72rem var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.asiento{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1.5px dashed var(--gris)}
.asiento input{width:100%;min-width:0;min-height:44px;padding:8px 10px;border:2px solid var(--tinta);background:#fffdf6;color:var(--tinta)}
.asiento select{min-height:44px;border:2px solid var(--tinta);background:var(--papel);padding:0 6px}
.mini-btn{min-width:44px;min-height:44px;border:2px solid var(--tinta);background:var(--papel);font:700 .9rem var(--fm)}
.nota{font:italic .92rem/1.35 var(--fs);color:var(--gris);margin:6px 0}
.caja{border:2.5px solid var(--tinta);padding:10px 12px;margin:10px 0;background:#f7f2e3}
.caja.roja{border-color:var(--rojo)}
label.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;border-bottom:1.5px dashed var(--gris);font-weight:600}
label.tg input{width:24px;height:24px;accent-color:var(--rojo)}
/* tabla quién vence a quién */
.vence{display:grid;grid-template-columns:1fr;gap:8px}
.vence>div{display:flex;align-items:center;gap:8px;background:var(--carbon);color:var(--papel);padding:8px 10px;border-left:6px solid var(--c)}
.vence .sim{width:40px;height:40px;flex:none}.vence .mini-s{width:26px;height:26px}
.vence b{font-family:var(--fd);font-size:1.15rem;min-width:62px;color:var(--c)}
.vence span{font:.72rem var(--fm);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
/* ---------- mesa ---------- */
.mesa{height:100dvh;display:flex;flex-direction:column;color:var(--papel);overflow:hidden;
  background:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.6px) 0 0/13px 13px,radial-gradient(120% 80% at 50% 45%,#1e3a4a 0%,#0f1f29 55%,#07090b 100%)}
.msup{display:flex;align-items:center;gap:8px;background:var(--mostaza);color:#111;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;font:700 .72rem var(--fm);letter-spacing:.12em;text-transform:uppercase}
.msup .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<noscript>Activa JavaScript para jugar NEXUS CAOS.</noscript>
<script>window.NEXUS_EDICION = "normal";</script>
<script>/* ===== motor.js ===== */
/* NEXUS CAOS — Motor de reglas (sin interfaz, sin DOM).
 * Fuente de verdad de las reglas del documento "NEXUS CAOS" (ver docs/GUIA.md §Reglas).
 * Estado 100% serializable a JSON (sirve para guardar partida y para LAN).
 * API: crearJuego, nuevaPartida, acciones, esValida, aplicar, vista, verificar, cima, siguiente, formarJugada, vence. */
(function (raiz) {
  'use strict';
  const ELEM = ['fuego', 'tierra', 'agua', 'aire'];
  const NOMBRE = { fuego: 'Fuego', tierra: 'Tierra', agua: 'Agua', aire: 'Aire', caos: 'Caos' };
  // REGLAS DE ORDEN (documento): atacante -> { defensor: verbo }. Mismo elemento NO vence.
  const VENCE = {
    fuego: { aire: 'Arde', agua: 'Evapora', tierra: 'Incendia' },
    tierra: { agua: 'Absorbe', fuego: 'Apaga' },
    agua: { fuego: 'Apaga', tierra: 'Debilita' },
    aire: { tierra: 'Seca', fuego: 'Apaga' }
  };
  // MODO COMBOS (documento, tabla literal). "vence" mezcla ids de combo y elementos sueltos.
  const COMBOS = {
    oxigeno: { n: 'Oxígeno maligno', e: ['aire', 'fuego'], vence: ['lodo', 'aire', 'tormenta'] },
    lodo: { n: 'Lodo', e: ['agua', 'tierra'], vence: ['fogata', 'tierra', 'fuego'] },
    fogata: { n: 'Fogata máxima', e: ['tierra', 'fuego'], vence: ['aire', 'tierra'] },
    evaporacion: { n: 'Evaporación masiva', e: ['agua', 'fuego'], vence: ['vendaval'] },
    vendaval: { n: 'Vendaval', e: ['aire', 'tierra'], vence: ['fuego'] },
    tormenta: { n: 'Tormenta', e: ['aire', 'agua'], vence: ['vendaval'] }
  };
  const COMBO_DE = {};
  for (const k in COMBOS) COMBO_DE[COMBOS[k].e.slice().sort().join('+')] = k;

  // mano: cartas al repartir · tope: máximo en mano · desc: descalifica en -5 · piso: marcador no baja de 0
  const MODOS = {
    clasico: { n: 'Clásico', min: 2, max: 12, mano: 3, tope: 3, caos: true, combos: false, desc: true, piso: false },
    familiar: { n: 'Familiar y niños', min: 2, max: 12, mano: 3, tope: 3, caos: false, combos: false, desc: false, piso: true },
    combos: { n: 'Combos', min: 2, max: 6, mano: 6, tope: 9, caos: false, combos: true, desc: true, piso: false },
    solitario: { n: 'Solitario', min: 1, max: 1, mano: 3, tope: 3, caos: true, combos: false, desc: false, piso: false }
  };
  const META = 10, DESCALIFICA = -5;

  // ---------- azar reproducible (mulberry32, estado en J.rs) ----------
  function rnd(J) {
    let t = (J.rs = (J.rs + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function barajar(J, a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(J) * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }
  function crearMazo(conCaos) {
    const m = []; let id = 0;
    for (const e of ELEM) for (let i = 0; i < 12; i++) m.push({ id: id++, e });
    if (conCaos) { m.push({ id: 48, e: 'caos' }); m.push({ id: 49, e: 'caos' }); }
    return m;
  }

  // ---------- utilidades ----------
  function activos(J) { const r = []; J.jug.forEach((j, i) => { if (!j.fuera) r.push(i); }); return r; }
  function siguiente(J, i) {
    const n = J.jug.length;
    for (let k = 1; k <= n; k++) { const x = (((i + J.cfg.dir * k) % n) + n) % n; if (!J.jug[x].fuera) return x; }
    return i;
  }
  function cima(p) { return p.mesa[p.mesa.length - 1]; }
  function tope(J) { return MODOS[J.modo].tope; }

  // Convierte cartas elegidas en una jugada (o null si no es jugada posible en este modo).
  function formarJugada(J, cartas) {
    if (!cartas || !cartas.length || cartas.some(c => !c)) return null;
    if (cartas.length === 1) return cartas[0].e === 'caos' ? { k: 'caos' } : { k: 'carta', e: cartas[0].e };
    if (cartas.length === 2 && MODOS[J.modo].combos) {
      const a = cartas[0].e, b = cartas[1].e;
      if (a === b || a === 'caos' || b === 'caos') return null;
      const c = COMBO_DE[[a, b].sort().join('+')];
      return c ? { k: 'combo', c } : null;
    }
    return null;
  }
  // ¿La jugada j se sobrepone a la carta/combo de la mesa?
  function vence(j, top) {
    if (!j || !top) return false;
    if (j.k === 'caos') return true; // Caos vence a todo: victoria inmediata
    if (j.k === 'carta') return top.k === 'carta' && !!VENCE[j.e][top.e];
    const lista = COMBOS[j.c].vence;
    return top.k === 'combo' ? lista.indexOf(top.c) >= 0 : lista.indexOf(top.e) >= 0;
  }
  function verbo(j, top) {
    if (j.k === 'caos') return 'Caos total';
    if (j.k === 'carta') return VENCE[j.e][top.e] || '';
    return 'Vence';
  }
  // Jugadas válidas sin repetir tipo (una por elemento / combo). Devuelve acciones {t:'jugar', ids}.
  function jugadasValidas(J, mano, top) {
    const r = [], visto = {};
    for (const c of mano) {
      if (visto[c.e]) continue; visto[c.e] = 1;
      const j = formarJugada(J, [c]);
      if (j && vence(j, top)) r.push({ t: 'jugar', ids: [c.id] });
    }
    if (MODOS[J.modo].combos) {
      const vc = {};
      for (let x = 0; x < mano.length; x++) for (let y = x + 1; y < mano.length; y++) {
        const j = formarJugada(J, [mano[x], mano[y]]);
        if (!j || vc[j.c]) continue; vc[j.c] = 1;
        if (vence(j, top)) r.push({ t: 'jugar', ids: [mano[x].id, mano[y].id] });
      }
    }
    return r;
  }
  function capacidadRobo(J, j) { return Math.max(0, Math.min(tope(J) - j.mano.length, J.p.mazo.length)); }

  // ---------- creación ----------
  function crearJuego(cfg) {
    cfg = cfg || {};
    const modo = MODOS[cfg.modo] ? cfg.modo : 'clasico', M = MODOS[modo];
    const lista = Array.isArray(cfg.jugadores) ? cfg.jugadores : [];
    const nuevo = (j, i) => ({
      nombre: String((j && j.nombre) || ('Jugador ' + (i + 1))).slice(0, 16),
      tipo: (j && ['humano', 'bot', 'red', 'mazo'].indexOf(j.tipo) >= 0) ? j.tipo : 'bot',
      nivel: Math.max(1, Math.min(3, (j && j.nivel) | 0 || 2)),
      puntos: 0, ganadas: 0, fuera: false, mano: []
    });
    let jug;
    if (modo === 'solitario') {
      jug = [nuevo(lista[0] || { nombre: 'Tú', tipo: 'humano' }, 0), nuevo({ nombre: 'El Mazo', tipo: 'mazo' }, 1)];
      if (jug[0].tipo === 'mazo') jug[0].tipo = 'bot';
    } else {
      jug = lista.slice(0, M.max).map(nuevo).map(j => { if (j.tipo === 'mazo') j.tipo = 'bot'; return j; });
      if (jug.length < M.min) throw new Error('Se necesitan al menos ' + M.min + ' jugadores');
    }
    const J = {
      v: 1, modo,
      cfg: {
        castigoCaos: cfg.castigoCaos === 'fijo' ? 'fijo' : 'cartas',
        dir: cfg.dir === -1 ? -1 : 1,
        // Regla de la casa (NO está en el documento): si todos pasan y el turno vuelve a quien puso la carta
        // de la mesa, se saca una carta nueva del mazo. Por defecto solo en Combos (sin ella nadie gana en Combos).
        mesaLimpia: cfg.mesaLimpia != null ? !!cfg.mesaLimpia : modo === 'combos',
        caos: modo === 'solitario' ? cfg.caos !== false : M.caos
      },
      rs: (cfg.semilla >>> 0) || ((Math.random() * 4294967296) >>> 0),
      jug, np: 0, inicia: -1, campeon: -1, terminado: false, p: null,
      racha: { j: -1, n: 0 } // partidas seguidas ganadas por el mismo jugador ("mantener su racha")
    };
    if (cfg.dir === 0) J.cfg.dir = rnd(J) < 0.5 ? 1 : -1; // dirección al azar
    nuevaPartida(J);
    return J;
  }

  // La partida "siempre se da iniciado por una carta sacada del mazo". Caos no puede abrir:
  // vuelve al mazo en posición al azar (nunca arriba) y se saca otra.
  function voltearInicial(J, mazo) {
    let c = mazo.pop(), g = 0;
    while (c.e === 'caos' && g++ < 50) { mazo.splice(Math.floor(rnd(J) * mazo.length), 0, c); c = mazo.pop(); }
    return { k: 'carta', e: c.e, ids: [c.id], por: -1 };
  }

  function nuevaPartida(J) {
    if (J.terminado) throw new Error('El juego ya terminó');
    const M = MODOS[J.modo];
    J.np++;

  const M = raiz.Motor || require('./motor.js');
  const IA = raiz.IA || require('./ia.js');

  function prng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const C = (id, e) => ({ id, e });

  // Oráculo independiente: puntaje esperado según el documento (no reutiliza el motor).
  function deltaEsperado(modo, tipo, g, i, cartas, castigoCaos) {
    const n = cartas.length;
    if (i === g) return tipo === 'caos' ? 5 : 2;
    if (modo === 'familiar') return n === 3 ? -1 : 0;
    if (modo === 'combos') return n >= 2 ? -n : 0;
    if (tipo === 'caos') {
      if (cartas.indexOf('caos') >= 0) return 0;
      return castigoCaos === 'fijo' ? -3 : -n;
    }
    return n === 2 ? -1 : n === 3 ? -2 : 0;
  }

  // ---------- 1) casos fijos ----------
  function escenario(modo, manos, mesaE, mazoE, extra) {
    const jug = manos.map((m, i) => ({ nombre: 'J' + (i + 1), tipo: 'bot' }));
    const J = M.crearJuego(Object.assign({ modo, jugadores: modo === 'solitario' ? [jug[0]] : jug, semilla: 7 }, extra || {}));
    let id = 0;
    J.jug.forEach((j, i) => { j.mano = (manos[i] || []).map(e => C(id++, e)); });
    J.p.mesa = [{ k: 'carta', e: mesaE, ids: [id++], por: -1 }];
    J.p.mazo = (mazoE || []).map(e => C(id++, e));
    J.p.turno = 0; J.p.fase = 'turno';
    return J;
  }
  function casos() {
    const f = [];
    let total = 0;
    const ok = (c, msg) => { total++; if (!c) f.push(msg); };
    const V = (a, b) => M.vence({ k: 'carta', e: a }, { k: 'carta', e: b });
    // Reglas de orden
    ok(V('fuego', 'aire') && V('fuego', 'agua') && V('fuego', 'tierra'), 'Fuego debe vencer a Aire, Agua y Tierra');
    ok(V('tierra', 'agua') && V('tierra', 'fuego') && !V('tierra', 'aire'), 'Tierra vence a Agua y Fuego, no a Aire');
    ok(V('agua', 'fuego') && V('agua', 'tierra') && !V('agua', 'aire'), 'Agua vence a Fuego y Tierra, no a Aire');
    ok(V('aire', 'tierra') && V('aire', 'fuego') && !V('aire', 'agua'), 'Aire vence a Tierra y Fuego, no a Agua');
    ok(!V('fuego', 'fuego') && !V('agua', 'agua') && !V('aire', 'aire') && !V('tierra', 'tierra'), 'Mismo elemento no vence');
    ok(M.vence({ k: 'caos' }, { k: 'carta', e: 'aire' }), 'Caos vence a todo');
    // Combos (tabla literal)
    const K = (a, b) => M.vence({ k: 'combo', c: a }, typeof b === 'string' && M.COMBOS[b] ? { k: 'combo', c: b } : { k: 'carta', e: b });
    ok(K('oxigeno', 'lodo') && K('oxigeno', 'aire') && K('oxigeno', 'tormenta'), 'Oxígeno maligno: vence Lodo, Aire y Tormenta');
    ok(K('lodo', 'fogata') && K('lodo', 'tierra') && K('lodo', 'fuego'), 'Lodo: vence Fogata, Tierra, Fuego');
    ok(K('fogata', 'aire') && K('fogata', 'tierra'), 'Fogata: vence Aire y Tierra');
    ok(K('evaporacion', 'vendaval') && K('tormenta', 'vendaval') && K('vendaval', 'fuego'), 'Vendaval: lo vencen Evaporación y Tormenta; vence Fuego');
    ok(!M.vence({ k: 'carta', e: 'fuego' }, { k: 'combo', c: 'lodo' }), 'Carta suelta no vence combo');
    // Cerrado: con 3 pasa, con 2 roba 1, con 1 roba 1 o 2
    let J = escenario('clasico', [['agua', 'agua', 'tierra'], ['fuego']], 'aire', ['fuego', 'agua', 'tierra']);
    ok(JSON.stringify(M.acciones(J)) === '[{"t":"pasar"}]', 'Cerrado con 3 cartas: solo pasar');
    J = escenario('clasico', [['agua', 'tierra'], ['fuego']], 'aire', ['fuego', 'agua', 'tierra']);
    ok(JSON.stringify(M.acciones(J)) === '[{"t":"robar","n":1}]', 'Cerrado con 2: roba 1');
    ok(M.esValida(J, { t: 'pasar' }) !== '', 'Cerrado con 2 no puede pasar sin robar');
    J = escenario('clasico', [['agua'], ['fuego']], 'aire', ['agua', 'tierra', 'fuego']);
    ok(M.acciones(J).length === 2, 'Cerrado con 1: roba 1 o 2');
    M.aplicar(J, { t: 'robar', n: 2 });
    ok(J.jug[0].mano.length === 3 && J.p.fase === 'robado', 'Tras robar 2 queda con 3');
    ok(M.acciones(J).some(a => a.t === 'jugar') && M.acciones(J).some(a => a.t === 'pasar'), 'Tras robar: puede jugar o ceder');
    ok(M.esValida(J, { t: 'robar', n: 1 }) !== '', 'No se roba dos veces');

    ok(M.esValida(J, { t: 'pasar' }) !== '' && M.esValida(J, { t: 'robar', n: 1 }) !== '', 'Con jugada no puede pasar ni robar');
    // Ganar normal: +2, 1 carta 0, 2 cartas -1, 3 cartas -2
    J = escenario('clasico', [['fuego'], ['agua'], ['agua', 'agua'], ['agua', 'agua', 'agua']], 'aire', ['tierra']);
    M.aplicar(J, { t: 'jugar', ids: [0] });
    ok(J.p.fin && J.p.fin.tipo === 'normal' && J.jug.map(j => j.puntos).join() === '2,0,-1,-2', 'Puntaje normal 2/0/-1/-2');
    ok(J.inicia === 0, 'El ganador inicia la siguiente');
    ok(J.racha.j === 0 && J.racha.n === 1 && J.p.fin.mesaN === 2, 'Racha y conteo de cartas en mesa');
    // Caos: +5, quien tiene la otra Caos se salva, resto por cartas
    J = escenario('clasico', [['caos', 'agua'], ['caos', 'agua'], ['agua'], ['agua', 'agua', 'agua']], 'aire', ['tierra']);
    M.aplicar(J, { t: 'jugar', ids: [0] });
    ok(J.jug.map(j => j.puntos).join() === '5,0,-1,-3', 'Caos según cartas: 5/0/-1/-3');
    J = escenario('clasico', [['caos', 'agua'], ['agua'], ['agua', 'tierra']], 'aire', ['tierra'], { castigoCaos: 'fijo' });
    M.aplicar(J, { t: 'jugar', ids: [0] });
    ok(J.jug.map(j => j.puntos).join() === '5,-3,-3', 'Caos fijo: todos -3');
    // Cierre por lógica: nadie puede jugar ni robar → empate con castigo por cartas
    J = escenario('clasico', [['agua', 'agua', 'tierra'], ['agua', 'tierra', 'tierra']], 'aire', []);
    M.aplicar(J, { t: 'pasar' }); M.aplicar(J, { t: 'pasar' });
    ok(J.p.fin && J.p.fin.tipo === 'cierre' && J.jug.map(j => j.puntos).join() === '-2,-2', 'Cierre por lógica: -2/-2');
    // Descalificación en -5 y campeón en 10
    J = escenario('clasico', [['fuego'], ['agua', 'agua', 'agua'], ['agua']], 'aire', []);
    J.jug[1].puntos = -3; J.jug[0].puntos = 8;
    M.aplicar(J, { t: 'jugar', ids: [0] });
    ok(J.jug[1].fuera && J.terminado && J.campeon === 0, 'Descalifica en -5 y corona en 10');
    // Familiar: piso 0, solo 3 cartas pierde 1
    J = escenario('familiar', [['fuego'], ['agua', 'agua', 'agua'], ['agua', 'agua']], 'aire', []);
    M.aplicar(J, { t: 'jugar', ids: [0] });
    ok(J.jug.map(j => j.puntos).join() === '2,0,0', 'Familiar: piso 0');
    ok(!M.crearMazo(false).some(c => c.e === 'caos') && M.crearMazo(true).length === 50, 'Mazo 48 sin Caos / 50 con Caos');
    // Combos: combo vence, castigo -n
    J = escenario('combos', [['agua', 'tierra'], ['fuego', 'fuego', 'agua']], 'fuego', []);
    ok(M.esValida(J, { t: 'jugar', ids: [0, 1] }) === '', 'Lodo se juega sobre Fuego');
    M.aplicar(J, { t: 'jugar', ids: [0, 1] });
    ok(J.jug.map(j => j.puntos).join() === '2,-3', 'Combos: ganador +2, 3 cartas -3');
    // Solitario: el mazo sale primero; repetida se aparta
    J = M.crearJuego({ modo: 'solitario', jugadores: [{ nombre: 'T', tipo: 'humano' }], semilla: 3 });
    ok(J.p.turno === 1 && M.acciones(J)[0].t === 'voltear', 'Solitario: el mazo sale primero');
    ok(J.p.rival.mazo.length === 22 && M.verificar(J).length === 0, 'Solitario con Caos: mazo rival de 22');
    J = M.crearJuego({ modo: 'solitario', jugadores: [{ nombre: 'T', tipo: 'humano' }], semilla: 3, caos: false });
    ok(J.p.rival.mazo.length === 21, 'Solitario sin Caos: mazo rival de 21');
    // Acción inválida no altera el estado
    J = escenario('clasico', [['agua', 'tierra', 'fuego'], ['fuego']], 'aire', ['tierra']);
    const antes = JSON.stringify(J);
    M.aplicar(J, { t: 'jugar', ids: [0] }); M.aplicar(J, { t: 'jugar', ids: [99] }); M.aplicar(J, { t: 'xx' }); M.aplicar(J, null);
    ok(JSON.stringify(J) === antes, 'Acciones inválidas no cambian nada');
    casos.total = total;
    return f;
  }

  // ---------- 2) simulación masiva ----------
  const MODOS_SIM = ['clasico', 'clasico', 'familiar', 'combos', 'solitario'];
  function unJuego(sem, opt, est) {
    const r = prng(sem);
    const modo = opt.modo || MODOS_SIM[Math.floor(r() * MODOS_SIM.length)], MD = M.MODOS[modo];
    const n = modo === 'solitario' ? 1 : MD.min + Math.floor(r() * (MD.max - MD.min + 1));
    const jugadores = [];
    for (let i = 0; i < n; i++) jugadores.push({ nombre: 'B' + i, tipo: 'bot', nivel: 1 + Math.floor(r() * 3) });
    const J0 = M.crearJuego({ modo, jugadores, semilla: (sem * 2654435761) >>> 0, castigoCaos: r() < 0.5 ? 'fijo' : 'cartas', dir: r() < 0.5 ? 1 : -1, caos: r() < 0.7 });
    let J = J0;
    const fallo = msg => { est.errores.push('semilla ' + sem + ' [' + modo + ' ' + n + 'j] partida ' + J.np + ': ' + msg); return false; };
    const azar = r() < 0.25; // a veces juega al azar puro para explorar
    for (let partida = 0; partida < 300; partida++) {
      let pasos = 0;
      while (J.p.fase !== 'fin') {
        if (++pasos > 3000) return fallo('bucle: partida no termina');
        const v = M.verificar(J); if (v.length) return fallo(v.join('; '));
        const acc = M.acciones(J);
        for (const a of acc) { const e = M.esValida(J, a); if (e) return fallo('acción canónica inválida: ' + e); }
        if (opt.fuzz && r() < 0.15) {
          const yo = J.jug[J.p.turno], ids = yo.mano.map(c => c.id);
          const raro = [{ t: 'jugar', ids: [Math.floor(r() * 60)] }, { t: 'robar', n: Math.floor(r() * 5) - 1 }, { t: 'pasar' }, { t: 'jugar', ids: ids.slice(0, 2) }, { t: 'voltear' }, { t: 'jugar', ids: [ids[0], ids[0]] }][Math.floor(r() * 6)];
          const foto = JSON.stringify(J), res = M.aplicar(J, raro);
          if (!res.ok && JSON.stringify(J) !== foto) return fallo('acción inválida alteró el estado');
          est.fuzz++;
          if (res.ok) { est.acciones++; continue; }
        }
        if (opt.guardar && r() < 0.02) J = JSON.parse(JSON.stringify(J)); // guardar/cargar
        const a = azar ? acc[Math.floor(r() * acc.length)] : IA.elegir(J, r);
        const antes = J.jug.map(j => j.puntos);
        const res = M.aplicar(J, a);
        if (!res.ok) return fallo('IA eligió inválida: ' + res.error + ' ' + JSON.stringify(a));
        est.acciones++;
        if (J.p.fase === 'fin') {
          const fin = J.p.fin;
          est.fines[fin.tipo] = (est.fines[fin.tipo] || 0) + 1;
          if (modo !== 'solitario') {
            for (let i = 0; i < J.jug.length; i++) {
              if (antes[i] === undefined) continue;
              const jug = J.jug[i];
              const eraFuera = jug.fuera && fin.fuera.indexOf(i) < 0;
              if (eraFuera) continue;
              let d = deltaEsperado(modo, fin.tipo, fin.ganador, i, fin.cartas[i], J.cfg.castigoCaos);
              if (M.MODOS[modo].piso) d = Math.max(0, antes[i] + d) - antes[i];
              if (fin.delta[i] !== d || jug.puntos - antes[i] !== d) return fallo('puntaje ' + jug.nombre + ' esperado ' + d + ' obtuvo ' + fin.delta[i] + ' (' + fin.tipo + ', cartas ' + fin.cartas[i] + ')');
              if (M.MODOS[modo].desc && jug.puntos <= -5 && !jug.fuera) return fallo('no descalificó en ' + jug.puntos);
            }
            if (fin.ganador >= 0) est.porNivel[J.jug[fin.ganador].nivel]++;
          } else if (fin.tipo === 'normal' && (fin.mesaN < 4 || fin.mesaN > 6)) return fallo('solitario: la carta ganadora debe ser la 4ª, 5ª o 6ª de la mesa (fue ' + fin.mesaN + 'ª)');
          else if (fin.ganador >= 0) est.solo[fin.ganador]++;
          else est.solo[2]++;
        }
      }
      est.partidas++;
      if (J.terminado) break;
      if (modo === 'solitario' && partida >= 5) break;
      M.nuevaPartida(J);
    }
    if (modo !== 'solitario' && !J.terminado) return fallo('el juego no terminó en 300 partidas');
    est.juegos++;
    est.modos[modo] = (est.modos[modo] || 0) + 1;

  }

  function ejecutar(opt) {
    opt = Object.assign({ juegos: 200, semilla: 1, fuzz: true, guardar: true }, opt || {});

    tierra_s: '<circle cx="50" cy="50" r="42"/><path d="M50 10 V92"/><path d="M50 30 C40 26 30 30 22 40"/><path d="M50 30 C60 26 70 30 78 40"/><path d="M50 54 C38 50 24 56 14 66"/><path d="M50 54 C62 50 76 56 86 66"/><path d="M50 74 C42 74 34 80 30 88"/><path d="M50 74 C58 74 66 80 70 88"/>',

  function historialHTML() {

  // ======================================================================
  // JUEGO (controlador)
  // ======================================================================
  function iniciar(cfg, red, extra) {
    if (G) clearTimeout(G.timer);
    const J = M.crearJuego(cfg);
    const locales = []; J.jug.forEach((j, i) => { if (j.tipo === 'humano') locales.push(i); });
    G = Object.assign({ J, locales, viendo: locales.length ? locales[0] : 0, cubierto: false, ultimo: null, sel: [], timer: 0, red: red || null, contado: 0, cfg, mapaRed: {} }, extra || {});
    G.cubierto = locales.length > 1 && J.jug[J.p.turno].tipo === 'humano';
    if (G.cubierto) G.viendo = J.p.turno;
    pantalla = 'mesa';
    cerrarCapa();
    if (!AJ.tutorial) { AJ.tutorial = true; guardaAJ(); ciclo(); tutorial(); return; }
    ciclo();
  }
  function tutorial() {
    capa('<div class="cuerpo"><h2 class="tit">ANTES DE <span class="rojo">EMPEZAR</span></h2>' + tablaVence() +
      '<p class="ital">Toca una carta resaltada para lanzarla. Si no tienes ninguna, estás cerrado: roba o pasa. Quédate sin cartas para ganar.</p>' +
      '<button class="btn rj" data-a="cerrar">¡A jugar!</button></div>');
  }
  function vistaActual() { return G.J ? M.vista(G.J, G.viendo) : G.vista; }
  function demora() { return DEMORA[AJ.velocidad] || 760; }
  function guardar() {
    if (!G || !G.J || G.red) return;
    if (G.J.terminado && G.J.p.fase === 'fin') LS.del('partida');
    else LS.set('partida', { J: G.J, locales: G.locales, viendo: G.viendo, cfg: G.cfg });
  }
  function ciclo() {
    if (!G) return;
    clearTimeout(G.timer);
    if (!G.J) { pintarMesaSegura(); return; }
    const J = G.J, p = J.p;
    guardar();
    if (G.red && window.Red) difundirVistas();
    if (p.fase === 'fin') {
      pintarMesaSegura();
      contarStats();
      G.timer = setTimeout(mostrarFin, AJ.quieto ? 300 : 1100);
      return;
    }
    const t = J.jug[p.turno];
    if (t.tipo === 'humano') {
      if (G.locales.length > 1 && G.viendo !== p.turno) { G.viendo = p.turno; G.cubierto = true; }
      pintarMesaSegura();
      if (!G.cubierto) SND.turno();
    } else {
      pintarMesaSegura();
      if (t.tipo === 'bot' || t.tipo === 'mazo') G.timer = setTimeout(() => { if (!G || G.J !== J) return; const a = IA.elegir(J); if (a) hacer(a, p.turno); }, demora());
    }
  }
  function pintarMesaSegura() {
    if (pantalla !== 'mesa') return;
    try { const v = vistaActual(); $('#app').innerHTML = mesaHTML(v); marcarNuevas(v); } catch (e) { console.error(e); aviso('Error al pintar: ' + e.message); }
  }
  // Animación de reparto/robo: las cartas nuevas de mi mano entran desde el mazo; el contador del rival que robó salta.
  function marcarNuevas(v) {
    if (!G) return;
    const clave = v.np + ':' + v.yo, prev = G.manoPrev && G.manoPrev.k === clave ? G.manoPrev.ids : [];
    const nuevas = v.mano.filter(c => prev.indexOf(c.id) < 0).map(c => c.id);
    if (!G.cubierto) G.manoPrev = { k: clave, ids: v.mano.map(c => c.id) };
    const nPrev = G.nPrev && G.nPrev.np === v.np ? G.nPrev.n : null;
    G.nPrev = { np: v.np, n: v.jug.map(j => j.n) };
    if (AJ.quieto || G.cubierto) return;
    let k = 0;
    nuevas.forEach(id => { const el = document.querySelector('.mano .c[data-id="' + id + '"]'); if (el) { el.classList.add('nueva'); el.style.animationDelay = (k++ * 90) + 'ms'; } });
    if (nPrev) v.jug.forEach((j, i) => { if (j.n > nPrev[i]) { const el = document.querySelector('.rival[data-j="' + i + '"]'); if (el) el.classList.add('robo'); } });
  }
  function rectDe(sel) { const el = document.querySelector(sel); return el ? el.getBoundingClientRect() : null; }
  // Aplica una acción (local o anfitrión). quien = asiento que actúa.
  function hacer(a, quien, rectOrigen) {
    if (!G || !G.J) return { ok: false };
    const origen = rectOrigen || rectDe('.rival[data-j="' + quien + '"]') || rectDe('.yo');
    const r = M.aplicar(G.J, a, quien);
    if (!r.ok) {
      const t = G.J.jug[quien];
      if (t && t.tipo === 'humano') { aviso(r.error); SND.error(); }
      return r;
    }
    G.ultimo = r.ev; G.sel = [];
    efectos(r.ev);
    ciclo();
    animar(r.ev, r.ev.t === 'jugar' ? origen : null);
    return r;
  }
  function efectos(ev) {
    if (!ev) return;
    if (ev.t === 'jugar') {
      if (ev.jugada.k === 'caos') {
        SND.caos();
        if (!AJ.quieto) {
          const f = document.createElement('div'); f.className = 'flash caos'; f.innerHTML = '<div class="grande">¡CAOS!</div>';
          document.body.appendChild(f); setTimeout(() => f.remove(), 1700);
        }
      } else SND.carta(elemsJugada(ev.jugada)[0]);
    } else if (ev.t === 'robar') SND.robar();
    else if (ev.t === 'pasar' || ev.t === 'apartar') SND.pasar();
  }
  function animar(ev, origen) {
    if (AJ.quieto || !origen) return;
    const el = document.querySelector('.pila .arriba'); if (!el) return;
    const d = el.getBoundingClientRect(); if (!d.width) return;
    const dx = origen.left + origen.width / 2 - (d.left + d.width / 2), dy = origen.top + origen.height / 2 - (d.top + d.height / 2);
    const s = Math.max(0.25, Math.min(1.2, origen.width / d.width));
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
    el.getBoundingClientRect();
    el.classList.add('vuela');
    requestAnimationFrame(() => { el.style.transform = ''; });
  }
  // Acción del jugador de este dispositivo
  function jugadorActua(a, rect) {
    if (!G) return;
    const v = vistaActual();
    if (v.turno !== v.yo || v.fase === 'fin') { aviso('No es tu turno'); return; }
    if (G.J) hacer(a, v.yo, rect);
    else if (window.Red) { G.rectPend = rect; window.Red.enviar({ t: 'accion', a }); }
  }
  function contarStats() {
    const J = G.J; if (!J || G.contado === J.np || !J.p.fin) return;
    G.contado = J.np;
    const f = J.p.fin, loc = G.red ? [G.asientoLocal || 0] : G.locales;
    if (!loc.length) return;
    if (J.modo === 'solitario') { if (f.ganador === 0) ST.soloG++; else if (f.ganador === 1) ST.soloP++; guardaST(); return; }
    ST.partidas++;
    if (loc.indexOf(f.ganador) >= 0) { ST.ganadas++; if (f.tipo === 'caos') ST.caos++; }
    if (J.terminado && loc.indexOf(J.campeon) >= 0) ST.coronas++;
    guardaST();
    if (J.terminado) registrarHistorial(M.vista(J, -1));
  }
  // Historial de juegos terminados (se guarda en el dispositivo y se exporta con tus datos)
  function registrarHistorial(v) {
    const h = LS.get('historial', []);
    h.unshift({ fecha: new Date().toISOString(), modo: v.modo, partidas: v.np, campeon: v.campeon >= 0 ? v.jug[v.campeon].nombre : null, lan: !!(G && G.red),
      jugadores: v.jug.map(j => ({ nombre: j.nombre, tipo: j.tipo, puntos: j.puntos, ganadas: j.ganadas, fuera: j.fuera })) });
    LS.set('historial', h.slice(0, 100));
  }

  // ---------- texto del cartel ----------
  function textoEvento(ev, v) {
    const n = i => i >= 0 && v.jug[i] ? esc(v.jug[i].nombre).toUpperCase() : 'MESA';
    if (!ev) {
      const top = v.mesa[v.mesa.length - 1];
      return 'PARTIDA ' + v.np + ' · LA MESA ABRE CON <b>' + nombreJugada(top) + '</b> · INICIA ' + n(v.turno);
    }
    if (ev.t === 'jugar') {
      const j = ev.jugada;
      if (j.k === 'caos') return n(ev.p) + ' LANZA <b>CAOS</b>: ¡FINAL TOTAL!';
      if (j.k === 'combo') return n(ev.p) + ': <b>' + nombreJugada(j) + '</b> VENCE A ' + nombreJugada(ev.sobre);
      return n(ev.p) + ': <b>' + NOM(j.e) + '</b> ' + (j.verbo || '').toUpperCase() + ' ' + nombreJugada(ev.sobre);
    }
    if (ev.t === 'robar') return n(ev.p) + ' ESTÁ CERRADO Y ROBA ' + ev.n;
    if (ev.t === 'pasar') return (ev.robo ? n(ev.p) + ' CEDE EL TURNO' : n(ev.p) + ' PASA (CERRADO)') + (ev.limpia ? ' · MESA LIMPIA: SALE <b>' + NOM(ev.limpia) + '</b>' : '');
    if (ev.t === 'apartar') return 'EL MAZO SACA ' + NOM(ev.carta.e) + (ev.sobre && ev.sobre.e === ev.carta.e ? ': REPETIDA' : ': NO SE SOBREPONE A ' + nombreJugada(ev.sobre)) + ', SE APARTA · <b>SIGUES TÚ</b>';
    if (ev.t === 'agotado') return 'EL MAZO SE AGOTÓ';
    return '';
  }

  // ---------- mesa ----------
  function mesaHTML(v) {
    const MD = M.MODOS[v.modo], yo = v.yo, top = v.mesa[v.mesa.length - 1], miTurno = v.turno === yo && v.fase !== 'fin';
    const rev = AJ.reverso;
    // rivales en orden de juego a partir de mí
    const orden = []; const n = v.jug.length;
    for (let k = 1; k < n; k++) orden.push((((yo + v.dir * k) % n) + n) % n);
    const rivales = orden.map(i => {
      const j = v.jug[i], esMazo = j.tipo === 'mazo';
      const cnt = esMazo ? v.rival.mazo : j.n;
      const fan = Array.from({ length: Math.min(esMazo ? 3 : cnt, MD.tope) }, () => A.reverso(rev)).join('');
      const racha = v.racha && v.racha.j === i && v.racha.n >= 2 ? ' · RACHA ×' + v.racha.n : '';
      const est = esMazo ? 'PUESTAS ' + v.rival.puestas + '/3 · APARTADAS ' + v.rival.apartadas : (j.fuera ? 'FUERA' : '★' + j.ganadas + racha + (j.tipo === 'bot' ? ' · ' + NIVEL[j.nivel] : j.tipo === 'red' ? ' · LAN' : ''));
      const ultima = !esMazo && !j.fuera && j.n === 1 && v.fase !== 'fin';
      return '<div class="rival' + (v.turno === i && v.fase !== 'fin' ? ' turno' : '') + (j.fuera ? ' fuera' : '') + (ultima ? ' ultima' : '') + '" data-j="' + i + '">' + (ultima ? '<span class="aviso1">¡ÚLTIMA!</span>' : '') + '<span class="n">' + cnt + '</span><div class="abanico">' + fan + '</div>' +
        '<div class="nm">' + esc(j.nombre) + '</div>' + (esMazo ? '' : '<div class="pt' + (j.puntos < 0 ? ' neg' : '') + '">' + j.puntos + '</div>') + '<div class="est">' + est + '</div></div>';
    }).join('');
    // historia (jugadas anteriores)
    const hist = v.mesa.slice(0, -1).slice(-6).map(m => elemsJugada(m).map(e => A.carta(e)).join('')).join('');
    // pila
    const prev = v.mesa.length > 1 ? v.mesa[v.mesa.length - 2] : null;
    let pila = prev ? A.carta(elemsJugada(prev)[0], 'debajo') : '';
    const te = elemsJugada(top);
    pila += te.length === 2 ? A.carta(te[0], 'arriba') + A.carta(te[1], 'combo2') : A.carta(te[0], 'arriba');
    const mazoN = v.mazo, solo = v.modo === 'solitario';
    const mazo = (mazoN ? Array.from({ length: Math.min(3, mazoN) }, () => A.reverso(rev)).join('') : '<div class="vacio"></div>') + '<span class="cnt">' + (solo ? 'AUXILIAR ' : 'MAZO ') + mazoN + '</span>';
    // mano
    const jugables = {}, combos = [];
    (v.acciones || []).forEach(a => {
      if (a.t !== 'jugar') return;
      const es = a.ids.map(id => (v.mano.find(c => c.id === id) || {}).e);
      if (es.length === 1) jugables[es[0]] = 1; else combos.push(es.slice().sort().join('+'));
    });
    const cubierta = G && G.cubierto;
    const ORD = { fuego: 0, tierra: 1, agua: 2, aire: 3, caos: 4 };
    const manoOrd = v.mano.slice().sort((a, b) => ORD[a.e] - ORD[b.e] || a.id - b.id);
    const mano = cubierta ? v.mano.map(() => '<div class="c">' + A.reverso(rev) + '</div>').join('') : manoOrd.map(c => {
      const ok = miTurno && (jugables[c.e] || combos.some(k => k.split('+').indexOf(c.e) >= 0));
      const sel = G && G.sel.indexOf(c.id) >= 0;

    }).join('');
    // acciones

      const robos = v.acciones.filter(a => a.t === 'robar'), pasa = v.acciones.find(a => a.t === 'pasar'), hayJ = v.acciones.some(a => a.t === 'jugar');
      robos.forEach(a => { acc += '<button class="btn ms" data-a="robar" data-n="' + a.n + '">Robar ' + a.n + '</button>'; });
      if (MD.combos && G.sel.length) acc += '<button class="btn rj" data-a="lanzar"' + (seleccionValida(v) ? '' : ' disabled') + '>Lanzar ' + (seleccionValida(v) ? esc(seleccionValida(v)) : '') + '</button>';
      if (pasa) acc += '<button class="btn" data-a="pasar">' + (v.fase === 'robado' ? 'Ceder turno' : 'Pasar') + '</button>';
      if (v.fase === 'robado') pista = hayJ ? 'Juega una carta resaltada o cede el turno.' : 'No te sirvió: cede el turno.';
      else if (hayJ) pista = (v.mano.some(c => c.e === 'caos') ? '¡Tienes CAOS! ' : '') + 'Para vencer a ' + nombreJugada(top) + ': ' + quienVence(top, v.modo).join(', ') + (MD.combos ? '. Toca 1 o 2 cartas y lanza.' : '.');
      else if (robos.length) pista = 'Estás cerrado: roba ' + (robos.length > 1 ? '1 a ' + robos.length + ' cartas.' : '1 carta.');

      '<div class="rivales">' + rivales + '</div>' +

      '<div class="cartel">' + textoEvento(G ? G.ultimo : null, v) + '</div><div class="pista">' + pista + '</div></div>' +
      '<div class="abajo"><div class="yo' + (miTurno ? ' turno' : '') + '"><span>' + esc(yoJ.nombre) + (v.modo === 'solitario' ? '' : ' · ★' + yoJ.ganadas + miRacha) + (miTurno ? ' · TU TURNO' : '') + '</span><span class="pts">' + info + '</span></div>' +
      '<div class="mano' + (muchas ? ' muchas' : '') + (miTurno ? '' : ' espera') + '" style="--n:' + v.mano.length + '">' + mano + '</div>' +
      '<div class="acc">' + acc + '</div></div></div>' +
      (cubierta ? '<div class="cubre">' + A.logo() + '<p class="maq">Pasa el dispositivo a</p><h2>' + esc(yoJ.nombre) + '</h2><button class="btn ms" style="max-width:320px" data-a="destapar">Soy ' + esc(yoJ.nombre) + ': ver mis cartas</button></div>' : '');

  function seleccionValida(v) {
    const cartas = G.sel.map(id => v.mano.find(c => c.id === id)).filter(Boolean);
    if (!cartas.length) return '';
    const a = v.acciones.find(x => x.t === 'jugar' && x.ids.length === cartas.length && x.ids.map(id => (v.mano.find(c => c.id === id) || {}).e).sort().join('+') === cartas.map(c => c.e).sort().join('+'));
    if (!a) return '';
    if (cartas.length === 1) return NOM(cartas[0].e);
    const k = M.COMBO_DE[cartas.map(c => c.e).sort().join('+')];

          '<div class="camino' + (MD.desc ? '' : ' sin-desc') + '"><i style="left:' + pos.toFixed(1) + '%"></i></div></td><td><span class="mini-c">' + f.cartas[i].map(e => A.carta(e)).join('') + '</span></td>' +

  // ======================================================================

  function autoprueba() {
    capa('<div class="cuerpo"><h2 class="tit">BOT DE PRUEBAS</h2><div class="pelicula" id="ap">Probando reglas, puntajes y pantallas…</div></div>');
    setTimeout(() => {
      const it = IA.iteraciones; IA.iteraciones = 6;
      const r = window.Pruebas.ejecutar({ juegos: 120, semilla: (Date.now() % 100000) + 1 });
      IA.iteraciones = it;
      // pantallas
      const errUI = [];
      const guardaP = pantalla, guardaG = G;
      ['inicio', 'nueva', 'reglas', 'ajustes', 'lan'].forEach(p => { try { const h = VISTAS[p](); if (!h || h.length < 100) errUI.push('Pantalla vacía: ' + p); } catch (e) { errUI.push(p + ': ' + e.message); } });
      ['clasico', 'familiar', 'combos', 'solitario'].forEach(modo => {
        try {
          const MD = M.MODOS[modo], js = [{ nombre: 'Yo', tipo: 'humano' }];
          for (let i = 1; i < Math.min(MD.max, 5); i++) js.push({ nombre: 'B' + i, tipo: 'bot', nivel: 1 });
          G = { J: M.crearJuego({ modo, jugadores: js, semilla: 99 }), locales: [0], viendo: 0, sel: [], ultimo: null };
          for (let k = 0; k < 60 && G.J.p.fase !== 'fin'; k++) {
            const h = mesaHTML(vistaActual()); if (h.indexOf('class="mesa"') < 0) errUI.push('Mesa mal: ' + modo);
            const a = IA.elegir(G.J); const res = M.aplicar(G.J, a); G.ultimo = res.ev;
            if (res.ok) textoEvento(res.ev, vistaActual());
          }
        } catch (e) { errUI.push('Mesa ' + modo + ': ' + e.message); }
      });
      G = guardaG; pantalla = guardaP;
      const ok = r.ok && !errUI.length;
      const lista = r.fallosCasos.concat(r.errores, errUI);
      const el = $('#ap'); if (!el) return;
      el.parentNode.innerHTML = '<h2 class="tit">' + (ok ? 'TODO <span class="rojo">OK</span>' : 'ERRORES') + '</h2>' +
        '<div class="pelicula">' + r.casos + ' casos de reglas · ' + r.juegos + ' juegos · ' + r.partidas + ' partidas · ' + r.acciones + ' acciones · ' + r.fuzz + ' acciones inválidas probadas · pantallas: ' + (errUI.length ? errUI.length + ' fallos' : 'ok') + ' · ' + r.ms + ' ms</div>' +
        (lista.length ? '<div class="caja roja">' + lista.slice(0, 15).map(esc).join('<br>') + '</div>' : '<p class="nota">Sin errores. Fines: ' + esc(JSON.stringify(r.fines)) + '</p>') +
        '<button class="btn" data-a="cerrar">Cerrar</button>';
      window.__autoprueba = { ok, r, errUI };
    }, 60);
  }

        (i === 0 ? '<span></span>' : '<button class="mini-btn" data-a="salaQuitar" data-i="' + i + '">✕</button>') + '</div>').join('');
      h += '<div class="fila-btn"><button class="btn ms" data-a="invitar"' + (SALA.asientos.length >= MD.max || !disp ? ' disabled' : '') + '>+ Invitar Wi-Fi</button><button class="btn" data-a="salaBot"' + (SALA.asientos.length >= MD.max ? ' disabled' : '') + '>+ Bot</button></div>';
      if (SALA.bt) h += '<div class="pelicula">Bluetooth: ' + esc(SALA.btEstado || 'sala abierta') + ' · los invitados emparejados tocan «Unirme por Bluetooth»</div>';

  function btListo() {

    const e = R.btEstado();

    if (e === 'apagado') { R.btActivar(); aviso('Activa el Bluetooth y vuelve a tocar'); return false; }
    if (e !== 'ok') { aviso('Este dispositivo no tiene Bluetooth'); return false; }

  }

  function difundirVistas() {
    const R = window.Red; if (!R || !G || !G.J) return;
    G.J.jug.forEach((j, i) => { if (j.tipo === 'red' && G.mapaRed && G.mapaRed[i]) R.enviarA(G.mapaRed[i], { t: 'vista', v: M.vista(G.J, i), ev: G.ultimo }); });
  }
  function redEventos() {
    const R = window.Red; if (!R || R._ui) return; R._ui = true;
    R.on('conectado', id => {
      if (R.rol === 'anfitrion') { if (pantalla === 'lan') { cerrarCapa(); pintar(); } }
      else { if (SALA) SALA.estado = 'Conectado. Esperando a que el anfitrión empiece…'; cerrarCapa(); if (pantalla === 'lan') pintar(); R.enviar({ t: 'hola', nombre: AJ.nombre }); }
    });
    R.on('mensaje', (id, o) => {
      if (!o || typeof o !== 'object') return;
      if (R.rol === 'anfitrion') {
        if (o.t === 'hola' && SALA) {
          const s = SALA.asientos.find(x => x.par === id);
          if (s) s.nombre = String(o.nombre || 'Invitado').slice(0, 16);
          else if (SALA.asientos.length < M.MODOS[SALA.modo].max) SALA.asientos.push({ nombre: String(o.nombre || 'Invitado').slice(0, 16), tipo: 'red', par: id });
          if (pantalla === 'lan') pintar();
        } else if (o.t === 'accion' && G && G.J) {
          const i = +Object.keys(G.mapaRed).find(k => G.mapaRed[k] === id);
          if (i >= 0) { const r = hacer(o.a, i); if (!r.ok) R.enviarA(id, { t: 'error', e: r.error }); }
        }
      } else {
        if (o.t === 'vista') {
          if (!G || G.J) { G = { J: null, vista: null, locales: [], viendo: 0, sel: [], ultimo: null, red: 'invitado' }; pantalla = 'mesa'; cerrarCapa(); }
          const antes = G.vista;
          G.vista = o.v; G.ultimo = o.ev; G.viendo = o.v.yo; G.sel = [];
          const nuevo = !antes || antes.np !== o.v.np || JSON.stringify(antes.mesa) !== JSON.stringify(o.v.mesa) || antes.turno !== o.v.turno || antes.fase !== o.v.fase;
          if (nuevo && o.ev && (!antes || antes.fase !== 'fin' || o.v.fase !== 'fin')) efectos(o.ev);
          const origen = o.ev && o.ev.t === 'jugar' ? (o.ev.p === o.v.yo ? G.rectPend : rectDe('.rival[data-j="' + o.ev.p + '"]')) : null;
          if (antes && antes.np !== o.v.np) cerrarCapa();
          pintarMesaSegura();
          if (nuevo) animar(o.ev, origen);
          if (o.v.turno === o.v.yo && o.v.fase !== 'fin' && nuevo) SND.turno();
          if (o.v.fase === 'fin' && (!antes || antes.fase !== 'fin' || antes.np !== o.v.np)) {
            setTimeout(mostrarFin, 1000);
            const f = o.v.fin; ST.partidas++;
            if (f.ganador === o.v.yo) { ST.ganadas++; if (f.tipo === 'caos') ST.caos++; }
            if (o.v.terminado && o.v.campeon === o.v.yo) ST.coronas++;
            guardaST();
            if (o.v.terminado) registrarHistorial(o.v);
          }
          if (o.v.terminado && o.v.fase === 'fin') { /* el campeón se ve desde el resumen */ }
        } else if (o.t === 'error') { aviso(o.e); SND.error(); }
        else if (o.t === 'sala' && SALA) { SALA.estado = o.texto; if (pantalla === 'lan') pintar(); }
      }
    });
    R.on('error', (id, t) => { aviso(t || 'Error de conexión'); SND.error(); if (R.rol !== 'anfitrion' && SALA && !(G && G.vista)) { SALA.estado = t || 'Error de conexión'; if (pantalla === 'lan') pintar(); } });
    R.on('btsala', (id, t) => { if (SALA) { SALA.btEstado = t === 'abierta' ? 'sala abierta' : 'sala cerrada'; if (pantalla === 'lan') pintar(); } });
    R.on('desconectado', id => {
      if (R.rol === 'anfitrion') {
        if (SALA) SALA.asientos = SALA.asientos.filter(s => s.par !== id || (G && G.J));
        if (G && G.J && G.mapaRed) {
          for (const k in G.mapaRed) if (G.mapaRed[k] === id) { G.J.jug[k].tipo = 'bot'; G.J.jug[k].nivel = 2; delete G.mapaRed[k]; aviso(G.J.jug[k].nombre + ' se desconectó: lo reemplaza un bot'); ciclo(); }
        } else if (pantalla === 'lan') pintar();
      } else {
        aviso('Se perdió la conexión con el anfitrión'); SALA = null;
        if (G && !G.J) { G = null; ir('lan'); }
      }
    });
  }

  // ======================================================================
  // ACCIONES (delegación de eventos)
  // ======================================================================
  const ACC = {
    inicio: () => ir('inicio'),
    nueva: () => ir('nueva'),
    reglas: () => ir('reglas'),
    ajustes: () => ir('ajustes'),
    lan: () => { redEventos(); ir('lan'); },
    cerrar: () => cerrarCapa(),
    rapida: () => iniciar({ modo: 'clasico', jugadores: [{ nombre: AJ.nombre, tipo: 'humano' }, { nombre: 'Ígnea', tipo: 'bot', nivel: 2 }, { nombre: 'Marea', tipo: 'bot', nivel: 2 }, { nombre: 'Céfiro', tipo: 'bot', nivel: 2 }], dir: 0 }),
    continuar: () => {
      const s = LS.get('partida', null); if (!s || !s.J) { aviso('No hay partida guardada'); return; }
      G = { J: s.J, locales: s.locales || [0], viendo: s.viendo || 0, cubierto: false, ultimo: null, sel: [], timer: 0, red: null, contado: s.J.p.fase === 'fin' ? s.J.np : 0, cfg: s.cfg };
      G.cubierto = G.locales.length > 1 && G.J.jug[G.J.p.turno].tipo === 'humano';
      if (G.cubierto) G.viendo = G.J.p.turno;
      pantalla = 'mesa'; ciclo();
    },
    modo: b => { NP.modo = b.dataset.v; NP.mesaLimpia = null; LS.set('config', NP); pintar(); },
    dir: b => { NP.dir = +b.dataset.v; LS.set('config', NP); pintar(); },
    castigo: b => { NP.castigoCaos = b.dataset.v; LS.set('config', NP); pintar(); },
    mas: b => { if (b.dataset.v === 'bot') NP.asientos.push(nuevoBot()); else NP.asientos.push({ nombre: 'Jugador ' + (NP.asientos.length + 1), tipo: 'humano', nivel: 2 }); LS.set('config', NP); pintar(); },
    quitar: b => { NP.asientos.splice(+b.dataset.i, 1); LS.set('config', NP); pintar(); },
    empezar: () => {
      LS.set('config', NP);
      const ml = NP.mesaLimpia == null ? NP.modo === 'combos' : NP.mesaLimpia;
      const jug = NP.modo === 'solitario' ? [{ nombre: AJ.nombre, tipo: 'humano' }] : NP.asientos.map(s => ({ nombre: s.nombre || 'Jugador', tipo: s.tipo, nivel: s.nivel }));
      try { iniciar({ modo: NP.modo, jugadores: jug, dir: NP.dir, castigoCaos: NP.castigoCaos, mesaLimpia: ml, caos: NP.caos }); } catch (e) { aviso(e.message); }
    },
    carta: b => {
      if (!G || G.cubierto) return;
      const v = vistaActual(), id = +b.dataset.id, c = v.mano.find(x => x.id === id);
      if (!c) return;
      if (v.turno !== v.yo || v.fase === 'fin') { aviso('Espera tu turno'); return; }
      const MD = M.MODOS[v.modo];
      if (MD.combos) {
        const k = G.sel.indexOf(id);
        if (k >= 0) G.sel.splice(k, 1); else { if (G.sel.length >= 2) G.sel.shift(); G.sel.push(id); }
        SND.toque(); pintarMesaSegura(); return;
      }
      const ok = v.acciones.some(a => a.t === 'jugar' && a.ids.length === 1 && (v.mano.find(x => x.id === a.ids[0]) || {}).e === c.e);
      if (!ok) { const top = v.mesa[v.mesa.length - 1]; aviso(NOM(c.e) + ' no vence a ' + nombreJugada(top)); SND.error(); return; }
      jugadorActua({ t: 'jugar', ids: [id] }, b.getBoundingClientRect());
    },
    lanzar: () => {
      const v = vistaActual();
      if (!seleccionValida(v)) { aviso('Esa jugada no vence a la mesa'); SND.error(); return; }
      const el = document.querySelector('.mano .c.sel');
      jugadorActua({ t: 'jugar', ids: G.sel.slice() }, el ? el.getBoundingClientRect() : null);
    },
    robar: b => jugadorActua({ t: 'robar', n: +b.dataset.n }),
    pasar: () => jugadorActua({ t: 'pasar' }),
    destapar: () => { G.cubierto = false; SND.turno(); pintarMesaSegura(); },
    menuMesa: () => menuMesa(),
    marcador: () => {
      const v = vistaActual(), MD = M.MODOS[v.modo], min = MD.desc ? M.DESCALIFICA : 0, rango = M.META - min;
      const orden = v.jug.map((j, i) => ({ j, i })).sort((a, b) => (a.j.fuera - b.j.fuera) || (b.j.puntos - a.j.puntos));
      capa('<div class="franja"><span>Marcador</span><span class="der">Partida ' + v.np + '</span></div><div class="cuerpo"><h2 class="tit">CAMINO A LA <span class="rojo">CORONA</span></h2>' +
        '<table class="res"><tr><th>Jugador</th><th>Cartas</th><th style="text-align:right">Total</th></tr>' + orden.map(o => {
          const pos = Math.max(0, Math.min(100, (o.j.puntos - min) / rango * 100)), racha = v.racha && v.racha.j === o.i && v.racha.n >= 2 ? ' · racha ×' + v.racha.n : '';
          return '<tr class="' + (o.j.fuera ? 'fuera' : '') + (o.i === v.turno ? ' gana' : '') + '"><td>' + esc(o.j.nombre) + ' <small>★' + o.j.ganadas + racha + '</small><div class="camino' + (MD.desc ? '' : ' sin-desc') + '"><i style="left:' + pos.toFixed(1) + '%"></i></div></td><td>' + (o.j.fuera ? 'FUERA' : o.j.n) + '</td><td class="tot">' + o.j.puntos + '</td></tr>';
        }).join('') + '</table><p class="nota">' + (MD.desc ? 'Rojo: zona negativa. En −5 quedas fuera; con 10 eres el rey de reyes.' : 'Gana quien llegue a 10.') + '</p><button class="btn" data-a="menuMesa">Volver</button></div>');
    },
    verVence: () => capa('<div class="cuerpo"><h2 class="tit">QUIÉN VENCE</h2>' + tablaVence() + '<button class="btn" data-a="cerrar">Volver</button></div>'),
    pausaAuto: () => { if (G) { clearTimeout(G.auto); G.np0 = -1; } const b = $('#btnSig'); if (b) b.textContent = 'Siguiente partida'; const pz = $('#btnPausa'); if (pz) pz.remove(); },
    siguiente: () => {
      if (!G || !G.J || G.J.p.fase !== 'fin' || G.J.terminado) return;
      clearTimeout(G.auto); G.np0 = -1;
      cerrarCapa(); M.nuevaPartida(G.J); G.ultimo = null; G.sel = [];
      SND.robar(); setTimeout(() => SND.robar(), 120);
      if (EDICION === 'normal' && G.J.np % 4 === 0) { try { window.NexusAnuncios.entrePartidas(G.J.np); } catch (e) {} }
      if (G.locales.length > 1 && G.J.jug[G.J.p.turno].tipo === 'humano') { G.viendo = G.J.p.turno; G.cubierto = true; }
      ciclo();
    },
    campeon: () => mostrarCampeon(),
    revancha: () => {
      if (!G || !G.J) return;
      const cfg = Object.assign({}, G.cfg, { jugadores: G.J.jug.map(j => ({ nombre: j.nombre, tipo: j.tipo, nivel: j.nivel })), semilla: 0 });
      if (G.red) iniciar(cfg, 'anfitrion', { mapaRed: G.mapaRed, asientoLocal: 0 }); else iniciar(cfg);
    },
    salir: () => salir(),
    vel: b => { AJ.velocidad = b.dataset.v; guardaAJ(); if (pantalla === 'ajustes') pintar(); else menuMesa(); },
    reverso: b => { AJ.reverso = b.dataset.v; guardaAJ(); pintar(); },
    autoprueba: () => autoprueba(),
    exportar: () => {
      const d = { juego: 'nexus-caos', v: VERSION, fecha: new Date().toISOString(), datos: {} };
      ['ajustes', 'stats', 'config', 'partida', 'historial'].forEach(k => { const x = LS.get(k, null); if (x != null) d.datos[k] = x; });
      const nombre = 'nexus-caos-datos-' + d.fecha.slice(0, 10) + '.json';
      if (window.AndroidApp && window.AndroidApp.exportar) { try { aviso('Guardado en ' + window.AndroidApp.exportar(nombre, JSON.stringify(d))); } catch (e) { aviso('No se pudo exportar: ' + e.message); } return; }
      try {
        const url = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000); aviso('Datos exportados');
      } catch (e) { aviso('No se pudo exportar: ' + e.message); }
    },
    importar: () => {
      const inp = $('#archivo'); if (!inp) return;
      inp.onchange = () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (!d || d.juego !== 'nexus-caos' || typeof d.datos !== 'object') throw new Error('no es un archivo de Nexus Caos');
            ['ajustes', 'stats', 'config', 'partida', 'historial'].forEach(k => { if (d.datos[k] != null) LS.set(k, d.datos[k]); });
            aviso('Datos importados'); setTimeout(() => location.reload(), 600);
          } catch (e) { aviso('Archivo inválido: ' + e.message); SND.error(); }
        };
        r.readAsText(f);
      };
      inp.click();
    },
    borrar: () => { if (!confirm('¿Borrar partida guardada, ajustes y récord?')) return; ['partida', 'ajustes', 'stats', 'config'].forEach(LS.del); location.reload(); },
    // LAN
    crearSala: () => { window.Red.anfitrion(); SALA = { rol: 'anfitrion', modo: 'clasico', asientos: [{ nombre: AJ.nombre, tipo: 'humano' }] }; pintar(); },
    unirme: () => { SALA = { rol: 'invitado', estado: 'Escanea o pega el código del anfitrión' }; pintar(); capa('<div class="cuerpo"><h2 class="tit">UNIRME</h2><p class="nota">Pide al anfitrión que toque «+ Invitar» y te muestre su código.</p>' + lectorHTML('responder') + '<button class="btn" data-a="cerrar">Cancelar</button></div>'); },
    invitar: async () => {
      capa('<div class="cuerpo"><h2 class="tit">INVITAR</h2><div class="pelicula">Preparando código…</div></div>');
      try {
        const cod = await window.Red.invitar();
        capa('<div class="cuerpo">' + codigoHTML(cod, 'INVITAR', 'Paso 1: el invitado escanea o pega este código.') + '<h3 class="tit">Paso 2: su respuesta</h3>' + lectorHTML('aceptar') + '<button class="btn" data-a="cerrar">Cerrar</button></div>');
      } catch (e) { capa('<div class="cuerpo"><div class="caja roja">' + esc(e.message) + '</div><button class="btn" data-a="cerrar">Cerrar</button></div>'); }
    },
    responder: async (b, cod) => {
      const txt = cod || ($('#sucod') || {}).value || '';
      if (!txt.trim()) { aviso('Pega o escanea el código'); return; }
      try {
        const resp = await window.Red.unirse(txt.trim());
        SALA.estado = 'Esperando a que el anfitrión lea tu respuesta…';
        capa('<div class="cuerpo">' + codigoHTML(resp, 'TU RESPUESTA', 'Muéstrale este código al anfitrión para que lo escanee o pegue.') + '<button class="btn" data-a="cerrar">Listo</button></div>');
        pintar();
      } catch (e) { aviso('Código inválido: ' + e.message); SND.error(); }
    },
    aceptar: async (b, cod) => {
      const txt = cod || ($('#sucod') || {}).value || '';
      if (!txt.trim()) { aviso('Pega o escanea la respuesta'); return; }
      try { await window.Red.aceptar(txt.trim()); aviso('Conectando…'); } catch (e) { aviso('Respuesta inválida: ' + e.message); SND.error(); }
    },
    escanear: b => {
      const v = $('#cam'); if (!v || !window.QRScan) return;
      v.classList.remove('oculto'); b.disabled = true;
      const accion = document.querySelector('#capa [data-a="responder"]') ? 'responder' : 'aceptar';
      window.QRScan.iniciar(v, txt => { v.classList.add('oculto'); ACC[accion](null, txt); }, e => { aviso('Cámara: ' + e); b.disabled = false; });
    },
    copiar: () => {
      const t = $('#micod'); if (!t) return;
      t.select();
      const ok = () => aviso('Código copiado');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (e) {} });
      else { try { document.execCommand('copy'); ok(); } catch (e) {} }
    },
    salaModo: b => { SALA.modo = b.dataset.v; const MD = M.MODOS[SALA.modo]; if (SALA.asientos.length > MD.max) SALA.asientos.length = MD.max; pintar(); },
    salaBot: () => { const us = SALA.asientos.map(s => s.nombre); SALA.asientos.push({ nombre: NOMBRES_BOT.find(n => us.indexOf(n) < 0) || 'Bot', tipo: 'bot', nivel: 2 }); pintar(); },
    salaQuitar: b => { const s = SALA.asientos[+b.dataset.i]; if (s && s.par) window.Red.cerrar(s.par); SALA.asientos.splice(+b.dataset.i, 1); pintar(); },
    salaEmpezar: () => {
      const mapa = {};
      const jug = SALA.asientos.map((s, i) => { if (s.tipo === 'red') mapa[i] = s.par; return { nombre: s.nombre, tipo: s.tipo, nivel: s.nivel || 2 }; });
      try { iniciar({ modo: SALA.modo, jugadores: jug, dir: 0 }, 'anfitrion', { mapaRed: mapa, asientoLocal: 0 }); } catch (e) { aviso(e.message); }
    },
    crearSalaBT: () => { if (!btListo()) return; ACC.crearSala(); ACC.abrirBT(); },
    abrirBT: () => { if (!btListo() || !SALA) return; window.Red.btAbrirSala(); SALA.bt = true; SALA.btEstado = 'abriendo…'; pintar(); },
    unirmeBT: () => {
      if (!btListo()) return;
      const lista = window.Red.btEmparejados();
      capa('<div class="cuerpo"><h2 class="tit">UNIRME POR <span class="rojo">BLUETOOTH</span></h2><p class="nota">Elige el celular del anfitrión (debe haber tocado «Crear sala Bluetooth»).</p>' +
        (lista.length ? lista.map(d => '<button class="btn" data-a="btUnir" data-mac="' + esc(d.mac) + '" data-n="' + esc(d.nombre || d.mac) + '">' + esc(d.nombre || 'Sin nombre') + ' <small>' + esc(d.mac) + '</small></button>').join('')
          : '<div class="caja roja">No hay celulares emparejados. Emparéjalos en Ajustes del sistema → Bluetooth y vuelve aquí.</div>') +
        '<button class="btn" data-a="cerrar">Cancelar</button></div>');
    },
    btUnir: b => { redEventos(); SALA = { rol: 'invitado', estado: 'Conectando por Bluetooth con ' + b.dataset.n + '…' }; window.Red.btUnirse(b.dataset.mac); cerrarCapa(); pintar(); },
    lanSalir: () => { if (window.Red) window.Red.salir(); SALA = null; ir('inicio'); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (b && !b.disabled && ACC[b.dataset.a]) { e.preventDefault(); try { ACC[b.dataset.a](b, null); } catch (er) { console.error(er); aviso('Error: ' + er.message); } return; }
    if (e.target.id === 'capa' && !document.querySelector('#capa [data-a="siguiente"],#capa [data-a="campeon"],#capa [data-a="revancha"]')) cerrarCapa();
  });
  document.addEventListener('change', e => {
    const t = e.target, c = t.dataset && t.dataset.c; if (!c) return;
    const i = +t.dataset.i;
    if (c === 'nombre') { NP.asientos[i].nombre = t.value.slice(0, 16) || 'Jugador'; LS.set('config', NP); }
    else if (c === 'tipo') { NP.asientos[i].tipo = t.value; LS.set('config', NP); pintar(); }
    else if (c === 'nivel') { NP.asientos[i].nivel = +t.value; LS.set('config', NP); }
    else if (c === 'mesaLimpia') { NP.mesaLimpia = t.checked; LS.set('config', NP); }
    else if (c === 'caos') { NP.caos = t.checked; LS.set('config', NP); }
    else if (c === 'minombre') { AJ.nombre = t.value.slice(0, 16) || 'Tú'; if (NP.asientos[0] && NP.asientos[0].tipo === 'humano') NP.asientos[0].nombre = AJ.nombre; guardaAJ(); LS.set('config', NP); }
    else if (c === 'sonido' || c === 'vibrar' || c === 'quieto' || c === 'auto') { AJ[c] = t.checked; guardaAJ(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarCapa(); });
  window.addEventListener('pagehide', guardar);

  // ---------- arranque ----------
  function arrancar() {
    A.instalar();
    guardaAJ();
    if (!$('#aviso')) { const a = document.createElement('div'); a.id = 'aviso'; a.setAttribute('role', 'status'); document.body.appendChild(a); }
    pintar();
  }
  // Botón "atrás" de Android (lo llama la app nativa): true = manejado.
  window.NexusAtras = () => {
    if ($('#capa')) { cerrarCapa(); return true; }
    if (pantalla === 'mesa') { menuMesa(); return true; }
    if (pantalla !== 'inicio') { ACC[pantalla === 'lan' ? 'lanSalir' : 'inicio'](); return true; }
    return false;
  };
  window.NexusUI = { ir, iniciar, vistaActual, get G() { return G; }, ACC, autoprueba, VISTAS };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
})();
</script>
</body>
</html>
